name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Read-only token. This job runs on every branch push and on pull requests, so
# it is the widest-reach workflow in the repo, and it needs nothing from the
# repository but the code. Without the block the job inherits the repository
# default, which is write on repos created before that default changed.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # A hung cmake or a pixi solve that never returns otherwise holds a runner
    # for the 6-hour default. Nothing here has ever taken more than a few
    # minutes, so the cap costs nothing and bounds the damage.
    timeout-minutes: 30
    # release.yml already builds the version-bump commit release.ps1 lands.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          # Do not leave the job's GITHUB_TOKEN in .git/config. This job runs on
          # every branch push and every pull request, and it shells out to a
          # build (cmake, pixi, the packaging scripts); none of that needs to
          # authenticate to GitHub, and nothing it runs should be able to read
          # the token back out of the checkout. Submodule cloning still works -
          # checkout authenticates during the fetch and only skips persisting.
          persist-credentials: false

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      # Same `pixi run test` a developer runs; the workflow owns no test logic.
      # All but two of the suites are C++ and depend on `build`, so pixi resolves
      # the whole graph and this step compiles before it tests. Named for what it
      # actually does rather than for the two PowerShell suites, because a
      # compile error surfacing under "Run script tests" is a wasted minute for
      # whoever reads the log.
      - name: Build and run the test suites
        shell: pwsh
        run: |
          pixi run test
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'pixi run test' failed"
            exit 1
          }

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain; the workflow owns none, so
      # local and CI can't drift. The task must succeed with no game installed.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'pixi run package' failed"
            exit 1
          }

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-installer.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
